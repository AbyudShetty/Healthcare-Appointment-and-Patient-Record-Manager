name: CI-CD Pipeline

on:
  push:
    branches-ignore: []
  pull_request:
    branches-ignore: []
  workflow_dispatch:

#on:
#  push:
#    branches: [main, develop]
#  pull_request:
#    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # --- PostgreSQL service for Django tests ---
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hcrm_db
          POSTGRES_USER: haprm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Backend setup ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping..."
          fi

      - name: Set environment variables for Django
        run: |
          echo "DB_NAME=hcrm_db" >> $GITHUB_ENV
          echo "DB_USER=haprm_user" >> $GITHUB_ENV
          echo "DB_PASSWORD=password" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DJANGO_SETTINGS_MODULE=hcrm_backend.settings" >> $GITHUB_ENV

      - name: Run migrations
        run: |
          if [ -f manage.py ]; then
            python manage.py migrate --noinput
          else
            echo "No manage.py found, skipping migrations..."
          fi

      - name: Run backend tests
        run: |
          if [ -d "tests" ]; then
            echo "Running main test suite..."
            pytest tests/ --disable-warnings --maxfail=3
          else
            echo "No test directory found, skipping..."
          fi

      # --- Frontend setup ---
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found in frontend/, skipping..."
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "No build script found, skipping..."
          fi

      - name: Run frontend linting
        working-directory: ./frontend
        run: |
          if [ -f package.json ] && npm list --depth=0 | grep -q eslint; then
            npm run lint
          else
            echo "No linting configured, skipping..."
          fi

  # --- Deployment job ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy using script
        run: bash ci_cd/deployment_script.sh

      - name: Verify deployment
        run: echo "Deployment verification complete."