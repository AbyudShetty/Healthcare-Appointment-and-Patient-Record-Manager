name: CI-CD Pipeline

on:
  push:
    branches-ignore: []
  pull_request:
    branches-ignore: []
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    # --- PostgreSQL service for Django tests ---
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hcrm_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Backend setup ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping..."
          fi

      - name: Set environment variables for Django
        run: |
          # The CI database is ephemeral, so use a fresh key for each job.
          encryption_key=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "::add-mask::$encryption_key"
          echo "HCRM_ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"
          echo "DB_NAME=hcrm_db" >> $GITHUB_ENV
          echo "DB_USER=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=password" >> $GITHUB_ENV
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DJANGO_SETTINGS_MODULE=hcrm_backend.settings" >> $GITHUB_ENV

      - name: Run migrations
        run: |
          if [ -f manage.py ]; then
            python manage.py migrate --noinput
          else
            echo "No manage.py found, skipping migrations..."
          fi

      - name: Run backend tests
        run: |
          if [ -d "tests" ]; then
            echo "Running test suite..."
            pytest --disable-warnings --maxfail=3
          else
            echo "No test directory found, skipping..."
          fi

      # --- 🧠 Add Performance Benchmark Tests ---
      - name: Run performance tests
        run: |
          if [ -d "tests/performance" ]; then
            echo "Running performance benchmarks..."
            pytest tests/performance/test_database_performance.py --benchmark-only --benchmark-min-rounds=5
          else
            echo "No performance tests found, skipping..."
          fi

      - name: Generate performance report
        if: always()
        run: |
          if [ -d "results" ]; then
            echo "Performance test results:"
            cat results/*.csv
          else
            echo "No performance results generated."
          fi

      # --- Frontend setup ---
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found in frontend/, skipping..."
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "No build script found, skipping..."
          fi

      - name: Run frontend linting
        working-directory: ./frontend
        run: |
          if [ -f package.json ] && npm list --depth=0 | grep -q eslint; then
            npm run lint
          else
            echo "No linting configured, skipping..."
          fi

