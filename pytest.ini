[pytest]
DJANGO_SETTINGS_MODULE = hcrm_backend.settings

# 👇 Ensure pytest sees project root (so tests.performance imports work)
pythonpath = .
testpaths = tests authentication/tests patients/tests appointments/tests electronic_records/tests audit_logs/tests reporting/tests
addopts = --import-mode=importlib

# Identify all valid test file patterns
python_files = tests.py test_*.py *_tests.py

filterwarnings =
    ignore::UserWarning:rest_framework_simplejwt
    ignore:pkg_resources is deprecated as an API:DeprecationWarning
